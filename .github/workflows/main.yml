name: Build WGold
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WGold 2.1 package
        run: |
          set -e
          mkdir -p wgold/DEBIAN
          mkdir -p wgold/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "wgold/Library/Application Support"

          # unzip assets
          unzip -q WGold.bundle.zip
          rm WGold.bundle.zip

          # move files into package
          mv WGold.dylib wgold/Library/MobileSubstrate/DynamicLibraries/
          mv WGold.plist wgold/Library/MobileSubstrate/DynamicLibraries/
          mv WGold.bundle "wgold/Library/Application Support/"

          # create control file
          cat > wgold/DEBIAN/control <<EOF
          Package: com.wgold
          Name: WGold
          Version: 2.1
          Architecture: iphoneos-arm
          Description: WGold tweak
          Maintainer: joe
          Author: joe
          Section: Tweaks
          Depends: mobilesubstrate
          SileoDepiction: https://apt.fouadraheb.com/package/com.wgold
          EOF

          # build deb
          dpkg-deb --build wgold wgold.deb
          ls -la wgold.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: WGold-2.1
          path: wgold.deb
